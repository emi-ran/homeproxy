services:
  homeproxy:
    build: .
    command: ["server", "-quic", "0.0.0.0:4433", "-socks", "0.0.0.0:1080", "-cert", "/secrets/cert.pem", "-key", "/secrets/key.pem", "-token-file", "/secrets/token"]
    ports:
      - "4433:4433/udp"
    volumes:
      - ./secrets:/secrets:ro
    networks:
      - private
      - transport
    read_only: true
    tmpfs:
      - /run/homeproxy:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    pids_limit: 128
    restart: unless-stopped
networks:
  private:
    internal: true
  transport: {}
